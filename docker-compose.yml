services:
  postgres:
    image: postgres:16-alpine
    container_name: manager-lms-db
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: manager_lms
    ports:
      - '5432:5432'
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms -d manager_lms']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  lms_pgdata:
