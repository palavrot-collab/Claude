<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>רפואת יער ישראל</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:520px; height:288px; }
  .bark { fill:var(--bark); }
  .brand { fill:var(--brand); }
  .sage { fill:var(--sage); }
  .sun { fill:var(--leaf); }
  .blk { rx:var(--radius-md); }
  .pill { rx:var(--radius-md); }
  .lf { fill:var(--sage-soft); }
  .lf-sun { fill:var(--leaf); }
  .lf-cut { fill:var(--brand); }
  .words { position:absolute; left:var(--space-7); bottom:var(--space-6); max-width:440px; direction:rtl; text-align:left; }
  .name { margin:0; font-size:80px; line-height:.95; font-weight:900; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0; font-family:var(--font-body); font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 520 288" width="520" height="288">
<!--
  blocks      bark 128x232 slab bled off the top (headline brown, the CTA) · brand 336x168 bleeding off the right (logo green, the largest) · sage 112x96 bled off the top (icon circles) · leaf 80x32 pill once (the sunlit highlight) — about 40% of 960x288
  arrangement one tall bark trunk with a wide green canopy beside it, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     the literal motif, a leaf: lens leaves of two radius-arcs (40px) along a branch over the canopy in sage-soft, two sunlit ones in leaf on the sage block, three cut from the trunk in brand; chosen because the logo is a figure inside a tree of leaves
  scales      sides in space-2 multiples; gutters space-4; leaf side space-6 + space-2 (40); corners radius-md; pill rx radius-md (half of 32)
-->
<rect class="bark blk" x="24" y="-16" width="128" height="232" rx="16"/>
<rect class="sun pill" x="24" y="232" width="80" height="32" rx="16"/>
<rect class="sage blk" x="168" y="-16" width="112" height="96" rx="16"/>
<rect class="brand blk" x="168" y="96" width="368" height="168" rx="16"/>
<path class="lf" transform="translate(196 212) rotate(0 20.0 20.0)" d="M0 40 A 40 40 0 0 1 40 0 A 40 40 0 0 1 0 40 Z"/>

</svg>
</div>
<div class="words">
<h1 class="name">רפואת יער<br>ישראל</h1>

</div>
</body>
